name: Changesets

# On push to main, open (or update) a "Version Packages" PR that bumps package.json and
# writes CHANGELOG.md from the pending changesets. Publishing to stores is still done by
# pushing a v* tag (see release.yml) — this only proposes the version bump.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: |
          pnpm check
          pnpm test

      - name: Create Version Packages PR
        uses: changesets/action@v1
        with:
          version: pnpm run version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
