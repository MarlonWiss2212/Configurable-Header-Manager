name: Changesets

# On push to main, consume any pending changesets: bump package.json and write CHANGELOG.md,
# then commit the result straight back to main. Publishing to stores is still done by pushing a
# v* tag (see release.yml) — this only lands the version bump.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages
        run: pnpm run version

      - name: Commit version bump
        run: |
          if git diff --quiet; then
            echo "No changesets to consume — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: version packages [skip ci]"
          git push
